name: FTP Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-deploy-production
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: Build and Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Install dependencies for test run
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate dependency lock file
        run: composer validate --no-check-publish --no-interaction

      - name: Run PHPUnit test suite
        run: |
          if [ -f phpunit.xml ] && [ -d tests ]; then
            vendor/bin/phpunit
          else
            echo "::warning::phpunit.xml or tests/ not found in repository. Skipping test step."
          fi

      - name: Build production vendor directory
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Audit production dependencies
        run: composer audit --locked --no-dev --no-interaction

      - name: Install LFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Sync files via LFTP (10 parallel streams)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --user "$FTP_USERNAME" --env-password "$FTP_SERVER" << 'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          set net:timeout 15
          set net:max-retries 3
          mirror --reverse --delete --parallel=10 \
            --exclude-glob .git* \
            --exclude-glob .github* \
            --exclude-glob .agents* \
            --exclude-glob .vscode* \
            --exclude-glob .DS_Store \
            --exclude-glob .env* \
            --exclude-glob .phpunit.result.cache \
            --exclude-glob README.md \
            --exclude-glob LICENSE \
            --exclude-glob phpunit.xml \
            --exclude-glob composer.json \
            --exclude-glob composer.lock \
            --exclude-glob package.json \
            --exclude-glob package-lock.json \
            --exclude-glob tests/ \
            --exclude-glob reports/ \
            --exclude-glob cache/ \
            --exclude-glob logs/ \
            --exclude-glob .ftpquota \
            ./ /
          quit
          EOF
